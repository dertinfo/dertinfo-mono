<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card appearance="outlined" class="user-card p-0" fxFlex="50">
      <mat-card-title class="mat-bg-primary">
        <div class="card-title-text">
          <span>Dances</span>
          <span fxFlex></span>
        </div>
      </mat-card-title>
      <mat-card-content>
        <div class="counter-box-container">
          <app-scorebox [title]="'Total'" [value]="$safeNavigationMigration(summary?.dancesCount)"></app-scorebox>
          <app-scorebox [title]="'Taken'" [value]="$safeNavigationMigration(summary?.dancesWithScoresTaken)"></app-scorebox>
          <app-scorebox [title]="'Checked'" [value]="$safeNavigationMigration(summary?.dancesWithScoresChecked)"></app-scorebox>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined" class="user-card p-0" fxFlex="50">
      <mat-card-title class="mat-bg-primary">
        <div class="card-title-text">
          <span>Scores</span>
          <span fxFlex></span>
        </div>
      </mat-card-title>
      <mat-card-content>
        <div class="counter-box-container">
          <app-scorebox [title]="'Total'" [value]="$safeNavigationMigration(summary?.individualScoresCount)"></app-scorebox>
          <app-scorebox [title]="'Taken'" [value]="$safeNavigationMigration(summary?.individualScoresTaken)"></app-scorebox>
          <app-scorebox [title]="'Checked'" [value]="$safeNavigationMigration(summary?.individualScoresChecked)"></app-scorebox>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
