<div fxFlex="100">


<mat-list class="compact-list mb-1">
    <mat-list-item class="" *ngFor="let registration of eventRegistrationOverviews" routerLink="/event-registration/{{registration.id}}/overview" data-testid="registration-row" [attr.data-registration-id]="registration.id">
      <img matListItemAvatar [src]="registration.groupPictureUrl | imageDimension: '100x100'" alt="">
      <span matListItemTitle class="text-muted">{{registration.groupName}}</span>
      <span matListItemMeta class="registration-meta">
        <span class="icon-count">
          <mat-icon>person</mat-icon>
          <small class="text-muted">{{registration.memberAttendancesCount + registration.guestAttendancesCount}}</small>
        </span>
        <span class="icon-count">
          <mat-icon>people</mat-icon>
          <small class="text-muted">{{registration.teamAttendancesCount}}</small>
        </span>
        <mat-chip-option mat-sm-chip [color]="registration.flowStateColour" [selected]="true">{{registration.flowStateText}}</mat-chip-option>
      </span>
    </mat-list-item>
  </mat-list>
</div>
