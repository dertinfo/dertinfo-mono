# Retired — Functions infrastructure is GitHub Actions

# The Bicep this pipeline deployed lived under apps/dert-functions/infra/bicep/
# and has been removed. New-stack templates are infra/bicep/functions/, deployed by
# .github/workflows/functions-infra-cd.yml (GitHub Environments development / production).
#
# Do not re-enable this Azure DevOps pipeline. Src CD YAML under this folder can remain
# until production traffic switches off the old Function App.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      echo "Retired. Deploy Functions infrastructure with GitHub Actions functions-infra-cd.yml."
      echo "Templates: infra/bicep/functions/"
    displayName: 'Point at GitHub Functions infra CD'
