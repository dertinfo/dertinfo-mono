name: Functions Src CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/dert-functions/**'
      - '.github/workflows/functions-src-cd.yml'
      - '.github/workflows/reusable-src-build-push-docker.yml'
      - '.github/workflows/reusable-src-deploy-dotnet-appservice.yml'

concurrency:
  group: functions-src-cd
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj

      - name: Build
        run: dotnet build apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj --no-build --configuration Release --output "${{ runner.temp }}/publish"

      - uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/publish

  docker-dev:
    needs: build
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: development
      dockerfile: apps/dert-functions/src/dertinfo-image-resize/Dockerfile
      context: apps/dert-functions/src/dertinfo-image-resize
      image_repository: dertinfo/dertinfo-imageresizev4

  deploy-dev:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-src-deploy-dotnet-appservice.yml
    with:
      environment: development
      target_app: functions
      package_path: .
      artifact_name: drop
      app_type: functionApp
      azure_oidc_workload: FUNCTIONS

  docker-prod:
    needs: deploy-dev
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: production
      dockerfile: apps/dert-functions/src/dertinfo-image-resize/Dockerfile
      context: apps/dert-functions/src/dertinfo-image-resize
      image_repository: dertinfo/dertinfo-imageresizev4

  deploy-prod:
    needs: [deploy-dev, build]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-src-deploy-dotnet-appservice.yml
    with:
      environment: production
      target_app: functions
      package_path: .
      artifact_name: drop
      app_type: functionApp
      azure_oidc_workload: FUNCTIONS
