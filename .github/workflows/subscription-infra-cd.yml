name: Subscription infra CD

# Deploys infra/bicep/subscription at subscription scope via a privileged SP (OIDC).
# Create GitHub Environments "development" and "production" with:
#   vars.AZURE_ENTRA_OIDC_CLIENTID_SUBSCRIPTION
#   vars.AZURE_ENTRA_OIDC_TENANTID
#   vars.AZURE_SUBSCRIPTION_DEPLOY_SUBSCRIPTIONID
# Workload SP object ids (optional; empty skips that part's RG RBAC):
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_CONFIG
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_MONITORING
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_STORAGE
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_API
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_WEB
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_APP
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_WORKLOAD_FUNCTIONS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: full
        options:
          - full
          - dev-only
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/subscription/**'
      - '.github/workflows/subscription-infra-cd.yml'
      - '.github/workflows/reusable-infra-deploy-bicep-subscription.yml'

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-subscription.yml
    with:
      environment: development
      parameters_path: infra/bicep/subscription/main.dev.bicepparam
      location: uksouth
      deployment_name: dertinfo-subscription-dev
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')) && needs.deploy-dev.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-subscription.yml
    with:
      environment: production
      parameters_path: infra/bicep/subscription/main.prod.bicepparam
      location: uksouth
      deployment_name: dertinfo-subscription-prod
    secrets: inherit
