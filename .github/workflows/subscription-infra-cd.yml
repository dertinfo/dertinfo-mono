name: Subscription infra CD

# Deploys infra/bicep/subscription at subscription scope via a privileged SP (OIDC).
# Create GitHub Environments "development" and "production" with:
#   vars.AZURE_ENTRA_OIDC_CLIENTID_SUBSCRIPTION
#   vars.AZURE_ENTRA_OIDC_TENANTID_SUBSCRIPTION
#   vars.AZURE_SUBSCRIPTION_DEPLOY_SUBSCRIPTIONID
# Optional (object id of the RG-scoped deploy identity, for role assignment in Bicep):
#   vars.AZURE_ENTRA_OIDC_PRINCIPALID_RG

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Parameter leaf / environment'
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/subscription/**'
      - '.github/workflows/subscription-infra-cd.yml'
      - '.github/workflows/reusable-deploy-bicep-subscription.yml'

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    uses: ./.github/workflows/reusable-deploy-bicep-subscription.yml
    with:
      environment: development
      parameters_path: infra/bicep/subscription/main.dev.bicepparam
      location: uksouth
      deployment_name: dertinfo-subscription-dev
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    uses: ./.github/workflows/reusable-deploy-bicep-subscription.yml
    with:
      environment: production
      parameters_path: infra/bicep/subscription/main.prod.bicepparam
      location: uksouth
      deployment_name: dertinfo-subscription-prod
    secrets: inherit
