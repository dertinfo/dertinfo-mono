name: Deploy Bicep to Azure resource group

# Workload identity deploys at RG scope only (AZURE_ENTRA_OIDC_CLIENTID_WORKLOAD_*).
# Subscription foundation uses reusable-infra-deploy-bicep-subscription.yml with a
# separate privileged SP — do not point this workflow at infra/bicep/subscription
# and do not pass AZURE_ENTRA_OIDC_CLIENTID_SUBSCRIPTION here.
#
# Same process for development and production: main.bicep + leaf main.<env>.bicepparam
# (extends main.shared.bicepparam), then optional overrides from the GitHub Environment
# (secrets / identifiable values).

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name (e.g. development, production)'
        required: true
        type: string
      resource_group:
        description: 'Target Azure resource group name'
        required: true
        type: string
      template_path:
        description: 'Path to main.bicep relative to repo root'
        required: true
        type: string
      parameters_path:
        description: 'Path to main.dev.bicepparam or main.prod.bicepparam relative to repo root'
        required: true
        type: string
      location:
        description: 'Azure location (used if the RG must exist already)'
        required: false
        type: string
        default: uksouth
      extra_parameters:
        description: 'Additional az --parameters overrides (non-secret), space-separated key=value'
        required: false
        type: string
        default: ''
      azure_oidc_workload:
        description: 'Workload suffix: CONFIG, MONITORING, STORAGE, API, WEB, APP, or FUNCTIONS'
        required: true
        type: string
    secrets:
      extra_secure_parameters:
        description: 'Optional secure --parameters string built by the caller from GitHub secrets'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Workload SP only — never AZURE_ENTRA_OIDC_CLIENTID_SUBSCRIPTION.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars[format('AZURE_ENTRA_OIDC_CLIENTID_WORKLOAD_{0}', inputs.azure_oidc_workload)] }}
          tenant-id: ${{ vars.AZURE_ENTRA_OIDC_TENANTID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_DEPLOY_SUBSCRIPTIONID }}

      - name: Ensure Bicep CLI
        run: az bicep install

      - name: Deploy Bicep (resource group)
        env:
          EXTRA_PARAMETERS: ${{ inputs.extra_parameters }}
          EXTRA_SECURE_PARAMETERS: ${{ secrets.extra_secure_parameters }}
          OIDC_WORKLOAD: ${{ inputs.azure_oidc_workload }}
          SQL_ADMIN_GROUP_NAME: ${{ vars.AZURE_ENTRA_SQL_ADMIN_GROUP_NAME }}
          SQL_ADMIN_GROUP_OBJECTID: ${{ vars.AZURE_ENTRA_SQL_ADMIN_GROUP_OBJECTID }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_ENTRA_OIDC_TENANTID }}
        run: |
          set -euo pipefail
          ARGS=(
            deployment group create
            --resource-group "${{ inputs.resource_group }}"
            --template-file "${{ inputs.template_path }}"
            --parameters "${{ inputs.parameters_path }}"
          )
          if [ -n "${EXTRA_PARAMETERS}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--parameters ${EXTRA_PARAMETERS})
          fi
          if [ "${OIDC_WORKLOAD}" = "STORAGE" ]; then
            if [ -n "${SQL_ADMIN_GROUP_NAME}" ]; then
              ARGS+=(--parameters "sqlEntraAdminGroupName=${SQL_ADMIN_GROUP_NAME}")
            fi
            if [ -n "${SQL_ADMIN_GROUP_OBJECTID}" ]; then
              ARGS+=(--parameters "sqlEntraAdminGroupObjectId=${SQL_ADMIN_GROUP_OBJECTID}")
            fi
            if [ -n "${ENTRA_TENANT_ID}" ]; then
              ARGS+=(--parameters "entraTenantId=${ENTRA_TENANT_ID}")
            fi
          fi
          if [ -n "${EXTRA_SECURE_PARAMETERS}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--parameters ${EXTRA_SECURE_PARAMETERS})
          fi
          az "${ARGS[@]}"
