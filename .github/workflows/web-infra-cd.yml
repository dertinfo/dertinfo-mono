name: Web infra CD

# Deploys infra/bicep/web at RG scope (Free Static Web App when prerequisitesExist
# is true in the Bicep param file). Custom domain bind is a second pass
# (customDomainReady) after DNS exists.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: full
        options:
          - full
          - dev-only
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/web/**'
      - '.github/workflows/web-infra-cd.yml'
      - '.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml'

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: development
      resource_group: rg-dev-dertinfo-web-uks
      template_path: infra/bicep/web/main.bicep
      parameters_path: infra/bicep/web/main.dev.bicepparam
      location: uksouth
      azure_oidc_workload: WEB
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')) && needs.deploy-dev.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: production
      resource_group: rg-prd-dertinfo-web-uks
      template_path: infra/bicep/web/main.bicep
      parameters_path: infra/bicep/web/main.prod.bicepparam
      location: uksouth
      azure_oidc_workload: WEB
    secrets: inherit
