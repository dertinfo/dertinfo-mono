name: API infra CD

# Deploys infra/bicep/api at RG scope (Windows App Service when prerequisites exist).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: full
        options:
          - full
          - dev-only
      prerequisites_override:
        description: 'App Service prerequisite handling'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - true
          - false
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/api/**'
      - '.github/workflows/api-infra-cd.yml'
      - '.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml'

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: development
      resource_group: rg-dev-dertinfo-api-uks
      template_path: infra/bicep/api/main.bicep
      parameters_path: infra/bicep/api/main.dev.bicepparam
      location: uksouth
      detect_prerequisites: true
      prerequisites_kind: api
      prerequisites_override: ${{ github.event_name == 'workflow_dispatch' && inputs.prerequisites_override || 'auto' }}
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')) && needs.deploy-dev.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: production
      resource_group: rg-prd-dertinfo-api-uks
      template_path: infra/bicep/api/main.bicep
      parameters_path: infra/bicep/api/main.prod.bicepparam
      location: uksouth
      detect_prerequisites: true
      prerequisites_kind: api
      prerequisites_override: ${{ github.event_name == 'workflow_dispatch' && inputs.prerequisites_override || 'auto' }}
    secrets: inherit
