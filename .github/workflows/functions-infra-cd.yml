name: Functions infra CD

# Deploys infra/bicep/functions at RG scope (Linux Flex Consumption when
# prerequisitesExist is true in the Bicep param file). Host storage roles stay
# here. Images Blob Data Contributor and Event Grid are storage infra CD.
# Notify email comes from GitHub Environment variable
# AZURE_MONITOR_FUNCTIONS_EXCESSIVEUSE_EMAIL (wired in the reusable resource-group deploy).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: full
        options:
          - full
          - dev-only
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/functions/**'
      - '.github/workflows/functions-infra-cd.yml'
      - '.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml'

jobs:
  deploy-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: development
      resource_group: rg-dev-dertinfo-functions-uks
      template_path: infra/bicep/functions/main.bicep
      parameters_path: infra/bicep/functions/main.dev.bicepparam
      location: uksouth
      azure_oidc_workload: FUNCTIONS
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')) && needs.deploy-dev.result == 'success'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-infra-deploy-bicep-resourcegroup.yml
    with:
      environment: production
      resource_group: rg-prd-dertinfo-functions-uks
      template_path: infra/bicep/functions/main.bicep
      parameters_path: infra/bicep/functions/main.prod.bicepparam
      location: uksouth
      azure_oidc_workload: FUNCTIONS
    secrets: inherit
